name: Checks

on:
  push:
  pull_request:

jobs:
  coding-standards:
    name: WordPress coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer
      - run: composer install --no-progress
      - run: vendor/bin/phpcs

  pages:
    name: Accessibility and layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start WordPress with the theme
        run: |
          npm start > playground.log 2>&1 &
          for i in $(seq 1 100); do grep -q "Ready" playground.log && exit 0; sleep 3; done
          cat playground.log; exit 1
      - run: npm test
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: tests/screenshots/
